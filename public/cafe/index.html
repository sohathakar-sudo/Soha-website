<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Café</title>
<link rel="icon" href="data:," />
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #101014;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #e8e8ec;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Scoped to the game canvas: the title screen's cat previews are drawn on
     canvases of their own, and a black fill would hide every one of them. */
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }

  /* --- title screen ----------------------------------------------------- */
  #title {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: rgba(16, 16, 20, .94);
    padding: 24px;
    box-sizing: border-box;
  }
  #title[hidden] { display: none; }
  #title h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  #title p { margin: 0; color: #9a9aa4; font-size: 13px; text-align: center; }
  #title label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #9a9aa4; }
  .field { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #title-name {
    font: inherit;
    font-size: 16px;
    width: 220px;
    padding: 8px 10px;
    text-align: center;
    color: #e8e8ec;
    background: #1d1d23;
    border: 1px solid #3a3a45;
    border-radius: 4px;
  }
  #title-cats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 100%; }
  .face-choice {
    padding: 4px;
    /* The same cream they stand on in the room, so the line art reads here
       exactly as it does in the game. */
    background: #f0e6d6;
    border: 2px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    line-height: 0;
  }
  .face-choice canvas { width: 64px; height: 64px; image-rendering: pixelated; }
  .face-choice[aria-pressed="true"] { border-color: #c2493d; }
  .face-choice:hover { border-color: #33302c; }
  #title-play {
    font: inherit;
    font-size: 15px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 10px 30px;
    color: #101014;
    background: #c98a4b;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #title-play:hover { background: #ddA061; }
  :focus-visible { outline: 2px solid #c98a4b; outline-offset: 3px; }

  /* --- debug editor ----------------------------------------------------- */
  #debug-bar {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #9a9aa4;
  }
  #debug-bar[hidden] { display: none; }
  #debug-copy {
    font: inherit;
    padding: 6px 12px;
    color: #e8e8ec;
    background: #2f2f37;
    border: 1px solid #45454f;
    border-radius: 4px;
    cursor: pointer;
  }
  #debug-copy:hover { background: #3b3b45; }

  /* --- roster: who's in the café --------------------------------------- */
  /* A tab on the left edge. Below the title and the mobile notice, above the
     room, so the title screen covers it and a phone never shows it. The whole
     thing slides left to tuck the body away, leaving only the café tab. */
  #roster {
    position: fixed;
    top: 16px;
    left: 0;
    z-index: 3;
    display: flex;
    align-items: flex-start;
    transition: transform .28s ease;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #roster[data-open="false"] { transform: translateX(-210px); }

  #roster-body {
    width: 210px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    box-sizing: border-box;
    /* The café's own cream, the colour the heads are drawn on, so they read
       here exactly as they do in the room and on the title screen. */
    background: rgba(240, 230, 214, .96);
    color: #33302c;
    border: 1px solid #d8c9b2;
    border-left: none;
    border-radius: 0 10px 10px 0;
    box-shadow: 3px 3px 0 rgba(51, 48, 44, .18);
  }
  #roster-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #6a6258;
    border-bottom: 1px solid #e0d2bc;
    position: sticky;
    top: 0;
    background: rgba(240, 230, 214, .96);
  }
  #roster-count {
    min-width: 18px;
    padding: 1px 6px;
    text-align: center;
    color: #f0e6d6;
    background: #c2493d;
    border-radius: 9px;
    font-size: 11px;
  }
  #roster-list {
    list-style: none;
    margin: 0;
    padding: 4px 0 6px;
  }
  #roster-list li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 12px 2px 6px;
  }
  .roster-head {
    position: relative;
    flex: none;
    width: 40px;
    height: 40px;
  }
  .roster-head img {
    position: absolute;
    left: 50%;
    bottom: 7px;
    width: 34px;
    height: 34px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transform: translateX(-50%);
    animation: roster-float var(--float-dur, 2.6s) ease-in-out infinite;
    animation-delay: var(--float-delay, 0s);
  }
  /* The warm, low-alpha shadow from the room, tightening and fading as the
     head rises — the same tell that puts a face in the room rather than on
     the glass. */
  .roster-head::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 4px;
    width: 20px;
    height: 5px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(60, 44, 32, .5), rgba(60, 44, 32, 0) 70%);
    animation: roster-shadow var(--float-dur, 2.6s) ease-in-out infinite;
    animation-delay: var(--float-delay, 0s);
  }
  @keyframes roster-float {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-3px); }
  }
  @keyframes roster-shadow {
    0%, 100% { opacity: .5; width: 20px; }
    50%      { opacity: .3; width: 16px; }
  }
  .roster-name {
    font-size: 13px;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #roster-empty {
    margin: 0;
    padding: 2px 12px 10px;
    font-size: 12px;
    color: #8a8176;
  }
  #roster[data-empty="false"] #roster-empty { display: none; }

  #roster-tab {
    align-self: flex-start;
    margin-top: 4px;
    flex: none;
    width: 26px;
    height: 40px;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    color: #f0e6d6;
    background: #c2493d;
    border: none;
    border-radius: 0 7px 7px 0;
    box-shadow: 2px 2px 0 rgba(51, 48, 44, .22);
  }
  #roster-tab:hover { background: #d4564a; }

  @media (prefers-reduced-motion: reduce) {
    .roster-head img, .roster-head::after { animation: none; }
  }

  #mobile-notice {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #101014;
    color: #e8e8ec;
    font-size: 16px;
    line-height: 1.5;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  @media (max-width: 699px) {
    /* --- debug editor ----------------------------------------------------- */
  #debug-bar {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #9a9aa4;
  }
  #debug-bar[hidden] { display: none; }
  #debug-copy {
    font: inherit;
    padding: 6px 12px;
    color: #e8e8ec;
    background: #2f2f37;
    border: 1px solid #45454f;
    border-radius: 4px;
    cursor: pointer;
  }
  #debug-copy:hover { background: #3b3b45; }

  #mobile-notice { display: flex; }
  #roster { display: none; }
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>

  <div id="roster" data-open="true" data-empty="true">
    <div id="roster-body">
      <div id="roster-header"><span>In the café</span><span id="roster-count">0</span></div>
      <ul id="roster-list"></ul>
      <p id="roster-empty">Nobody here yet.</p>
    </div>
    <button id="roster-tab" type="button" aria-label="Who's in the café" aria-expanded="true">☕</button>
  </div>

  <div id="title" hidden>
    <h1>The Café</h1>
    <p>WASD or arrows to walk · Enter to sit and buy coffee</p>
    <div class="field">
      <label for="title-name">Your name</label>
      <input id="title-name" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="guest" />
    </div>
    <div class="field">
      <label id="cats-label">Pick a face</label>
      <div id="title-cats" role="group" aria-labelledby="cats-label"></div>
    </div>
    <button id="title-play" type="button">Play</button>
  </div>

  <div id="debug-bar" hidden>
    <button id="debug-copy" type="button">Copy JSON</button>
    <span id="debug-note"></span>
  </div>

  <div id="mobile-notice"><p>The Café is desktop only for now.<br />Come back on a bigger screen.</p></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
